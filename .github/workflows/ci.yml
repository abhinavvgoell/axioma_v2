name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python API, worker, and evaluators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install API, worker, and development dependencies
        run: python -m pip install -e "services/api[dev]" -e "services/worker[dev]"
      - name: Run API and worker tests
        run: python -m pytest services/api/tests services/worker/tests -q
      - name: Run Mode 1 evaluator tests
        run: python -m pytest evaluation/mode1 -q
      - name: Lint Python
        run: ruff check services/api/src services/api/tests services/api/migrations services/worker/src services/worker/tests evaluation/mode1

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

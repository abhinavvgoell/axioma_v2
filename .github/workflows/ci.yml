name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python API, worker, and evaluators
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_DB: axioma
          POSTGRES_USER: axioma
          POSTGRES_PASSWORD: axioma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axioma -d axioma"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      AXIOMA_TEST_DATABASE_URL: postgresql+psycopg://axioma:axioma@localhost:5432/axioma
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install -e ../worker --no-deps
      - name: Apply migrations to PostgreSQL
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://axioma:axioma@localhost:5432/axioma
      - name: Run API and worker tests
        run: python -m pytest tests ../worker/tests -q
      - name: Run Mode 1 evaluator tests
        run: python -m pytest evaluation/mode1 -q
        working-directory: .
      - name: Lint Python
        run: ruff check src tests migrations ../worker/src ../worker/tests ../../evaluation/mode1

  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  sandbox:
    name: Docker sandbox abuse and Java harness
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/requirements.lock
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install -e . --no-deps
      - run: python -m pip install -e ../worker --no-deps
      - name: Pull prebuilt sandbox images
        run: |
          docker pull python:3.13-slim
          docker pull eclipse-temurin:21-jdk
        working-directory: .
      - name: Run Docker abuse and Java complexity checks
        run: python -m pytest services/worker/tests/test_sandbox_integration.py -q
        working-directory: .

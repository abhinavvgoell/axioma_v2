services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: axioma
      POSTGRES_USER: axioma
      POSTGRES_PASSWORD: axioma
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axioma -d axioma"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:


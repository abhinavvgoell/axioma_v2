[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "axioma-worker"
version = "0.1.0"
description = "Isolated analysis worker for Axioma"
requires-python = ">=3.13,<3.15"
dependencies = ["axioma-api==0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9", "ruff>=0.14,<0.15"]

[project.scripts]
axioma-worker = "axioma_worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

